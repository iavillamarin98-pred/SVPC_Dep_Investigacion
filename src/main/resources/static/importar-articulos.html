<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Importar Artículos - SVPC</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .contenedor {
            width: 900px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #1f3c88;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #555;
            font-size: 14px;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
            color: #333;
        }

        input[type="number"],
        input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            background: #1f3c88;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #162f6a;
        }

        .btn-secundario {
            background: #2e7d32;
        }

        .btn-secundario:hover {
            background: #1b5e20;
        }

        .btn-ranking {
            background: #6a1b9a;
        }

        .btn-ranking:hover {
            background: #4a148c;
        }

        .resultado {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }

        .exito {
            background: #e6f7ec;
            color: #1b7f3a;
            border: 1px solid #9bd8ad;
        }

        .error {
            background: #fdecea;
            color: #a1281f;
            border: 1px solid #f3aaa4;
        }

        .tabla-contenedor {
            margin-top: 30px;
            display: none;
        }

        .tabla-contenedor h2 {
            color: #1f3c88;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }

        th {
            background: #1f3c88;
            color: white;
            padding: 10px;
            border: 1px solid #ddd;
        }

        td {
            padding: 9px;
            border: 1px solid #ddd;
            text-align: center;
        }

        tr:nth-child(even) {
            background: #f2f4f8;
        }

        .puntaje {
            font-weight: bold;
            color: #1f3c88;
        }
    </style>
</head>

<body>

    <div class="contenedor">
        <h1>SVPC</h1>
        <p>Importación, cálculo y ranking de artículos científicos</p>

        <form id="formImportacion">
            <label for="idProceso">ID del proceso de valoración</label>
            <input type="number" id="idProceso" name="idProceso" value="1" required>

            <label for="archivo">Archivo Excel</label>
            <input type="file" id="archivo" name="archivo" accept=".xls,.xlsx" required>

            <button type="submit">Importar artículos</button>

            <button type="button" class="btn-secundario" onclick="calcularPuntajesArticulos()">
                Calcular puntajes de artículos
            </button>

            <button type="button" class="btn-ranking" onclick="cargarRankingArticulos()">
                Ver ranking de artículos
            </button>
        </form>

        <div id="resultado" class="resultado"></div>

        <div id="tablaRankingContenedor" class="tabla-contenedor">
            <h2>Ranking de docentes por artículos</h2>

            <table>
                <thead>
                    <tr>
                        <th>Puesto</th>
                        <th>Cédula</th>
                        <th>Docente</th>
                        <th>Carrera</th>
                        <th>Puntaje artículos</th>
                    </tr>
                </thead>
                <tbody id="tablaRanking">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const form = document.getElementById("formImportacion");
        const resultado = document.getElementById("resultado");
        const tablaRankingContenedor = document.getElementById("tablaRankingContenedor");
        const tablaRanking = document.getElementById("tablaRanking");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const archivo = document.getElementById("archivo").files[0];
            const idProceso = document.getElementById("idProceso").value;

            if (!archivo) {
                mostrarResultado("Debe seleccionar un archivo Excel.", false);
                return;
            }

            const formData = new FormData();
            formData.append("archivo", archivo);
            formData.append("idProceso", idProceso);

            mostrarResultado("Importando archivo, espere un momento...", true);

            try {
                const response = await fetch("/api/importaciones/articulos", {
                    method: "POST",
                    body: formData
                });

                const texto = await response.text();

                if (response.ok) {
                    mostrarResultado(texto, true);
                } else {
                    mostrarResultado(texto, false);
                }

            } catch (error) {
                mostrarResultado("Error al conectar con el servidor: " + error.message, false);
            }
        });

        async function calcularPuntajesArticulos() {
            const idProceso = document.getElementById("idProceso").value;

            if (!idProceso) {
                mostrarResultado("Debe ingresar el ID del proceso.", false);
                return;
            }

            mostrarResultado("Calculando puntajes de artículos...", true);

            try {
                const response = await fetch("/api/calculos/articulos?idProceso=" + encodeURIComponent(idProceso), {
                    method: "POST"
                });

                const texto = await response.text();

                if (response.ok) {
                    mostrarResultado(texto, true);
                    await cargarRankingArticulos();
                } else {
                    mostrarResultado(texto, false);
                }

            } catch (error) {
                mostrarResultado("Error al conectar con el servidor: " + error.message, false);
            }
        }

        async function cargarRankingArticulos() {
            const idProceso = document.getElementById("idProceso").value;

            if (!idProceso) {
                mostrarResultado("Debe ingresar el ID del proceso.", false);
                return;
            }

            mostrarResultado("Cargando ranking de artículos...", true);

            try {
                const response = await fetch("/api/calculos/articulos/ranking?idProceso=" + encodeURIComponent(idProceso), {
                    method: "GET"
                });

                if (!response.ok) {
                    const textoError = await response.text();
                    mostrarResultado(textoError, false);
                    return;
                }

                const ranking = await response.json();

                tablaRanking.innerHTML = "";

                if (ranking.length === 0) {
                    tablaRankingContenedor.style.display = "none";
                    mostrarResultado("No existen puntajes de artículos para mostrar en el ranking.", false);
                    return;
                }

                ranking.forEach(item => {
                    const fila = document.createElement("tr");

                    const nombreCompleto = `${item.nombres ?? ""} ${item.apellidos ?? ""}`.trim();

                    fila.innerHTML = `
                    <td>${item.puesto}</td>
                    <td>${item.cedula ?? ""}</td>
                    <td>${nombreCompleto}</td>
                    <td>${item.carrera ?? ""}</td>
                    <td class="puntaje">${Number(item.puntajeArticulos).toFixed(2)}</td>
                `;

                    tablaRanking.appendChild(fila);
                });

                tablaRankingContenedor.style.display = "block";
                mostrarResultado("Ranking de artículos cargado correctamente.", true);

            } catch (error) {
                mostrarResultado("Error al cargar ranking: " + error.message, false);
            }
        }

        function mostrarResultado(mensaje, exito) {
            resultado.style.display = "block";
            resultado.textContent = mensaje;

            resultado.classList.remove("exito");
            resultado.classList.remove("error");

            if (exito) {
                resultado.classList.add("exito");
            } else {
                resultado.classList.add("error");
            }
        }
    </script>

</body>

</html>
