<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Importar Proceedings - SVPC</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .contenedor {
            width: 500px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0, 0, 0, .12);
        }

        h1 {
            text-align: center;
            color: #1f3c88;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #555;
            font-size: 14px;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input[type="number"],
        input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #1f3c88;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #17306f;
        }

        .resultado {
            display: none;
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        .exito {
            background: #e6f7ec;
            color: #1b7f3a;
            border: 1px solid #9bd8ad;
        }

        .error {
            background: #fdecea;
            color: #a1281f;
            border: 1px solid #f3aaa4;
        }
    </style>

</head>

<body>

    <div class="contenedor">

        <h1>SVPC</h1>

        <p>Importación de Proceedings</p>

        <form id="formImportacion">

            <label>ID del proceso de valoración</label>

            <input type="number" id="idProceso" value="1" required>

            <label>Archivo Excel</label>

            <input type="file" id="archivo" accept=".xls,.xlsx" required>

            <button type="submit">
                Importar Proceedings
            </button>

        </form>

        <div id="resultado" class="resultado"></div>

    </div>

    <script>

        const form = document.getElementById("formImportacion");

        const resultado = document.getElementById("resultado");

        form.addEventListener("submit", async function (e) {

            e.preventDefault();

            const archivo = document.getElementById("archivo").files[0];

            const idProceso = document.getElementById("idProceso").value;

            if (!archivo) {

                mostrarResultado(
                    "Seleccione un archivo.",
                    false
                );

                return;
            }

            const formData = new FormData();

            formData.append("archivo", archivo);

            formData.append("idProceso", idProceso);

            mostrarResultado(
                "Importando proceedings...",
                true
            );

            try {

                const response = await fetch(
                    "/api/importaciones/proceedings",
                    {
                        method: "POST",
                        body: formData
                    }
                );

                const texto = await response.text();

                if (response.ok) {

                    mostrarResultado(texto, true);

                } else {

                    mostrarResultado(texto, false);

                }

            } catch (error) {

                mostrarResultado(
                    "Error al conectar con el servidor: "
                    + error.message,
                    false
                );

            }

        });

        function mostrarResultado(mensaje, exito) {

            resultado.style.display = "block";

            resultado.textContent = mensaje;

            resultado.classList.remove("exito");

            resultado.classList.remove("error");

            if (exito) {

                resultado.classList.add("exito");

            } else {

                resultado.classList.add("error");

            }

        }

    </script>

</body>

</html>
