<div id="modalDocente" class="modal oculto">

    <div class="modal-content modal-docentes">

        <div class="modal-header">

            <h3>
                <i class="fa-solid fa-user-tie"></i>
                Buscar docente
            </h3>

            <button class="btn-cerrar" onclick="cerrarBuscadorDocente()">
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>

        <div class="modal-body">

            <!-- BUSCADOR -->
            <div class="filtros-docentes">

                <div class="campo-busqueda">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input type="text" id="txtBuscarDocente"
                        placeholder="Buscar por cédula, nombre, apellidos o facultad...">

                </div>

            </div>

            <!-- TABLA -->
            <div class="tabla-docentes-container">

                <table class="tabla-docentes">

                    <thead>

                        <tr>
                            <th>Cédula</th>
                            <th>Docente</th>
                            <th>Facultad</th>
                            <th>Carrera</th>
                            <th>Acción</th>
                        </tr>

                    </thead>

                    <tbody id="tbodyDocentes">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<!-- ========================================= -->
<!-- MODAL ROL -->
<!-- ========================================= -->

<div id="modalRol" class="modal oculto">

    <div class="modal-content" style="max-width:400px;">

        <div class="modal-header">

            <h3>Rol del participante</h3>

        </div>

        <div class="modal-body">

            <div class="campo">

                <label>Rol</label>

                <select id="rolParticipante">

                    <option value="DIRECTOR">
                        DIRECTOR
                    </option>

                    <option value="INTEGRANTE">
                        INTEGRANTE
                    </option>

                </select>

            </div>

            <div class="acciones">

                <button class="btn btn-primary" onclick="confirmarRol()">

                    Aceptar

                </button>

                <button class="btn btn-warning" onclick="cerrarModalRol()">

                    Cancelar

                </button>

            </div>

        </div>

    </div>

</div>
