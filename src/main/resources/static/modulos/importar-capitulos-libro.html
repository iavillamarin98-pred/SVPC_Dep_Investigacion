<div class="module">

    <!-- ==========================================
         ENCABEZADO
         ========================================== -->

    <div class="module-header">

        <h2>Capítulos de Libro</h2>

        <p>
            Importación, cálculo de puntajes y ranking de capítulos de libro.
        </p>

    </div>


    <!-- ==========================================
         CONTENIDO
         ========================================== -->

    <div class="libros-layout">


        <!-- ======================================
             PANEL IZQUIERDO
             ====================================== -->

        <div class="libros-panel-izquierdo">

            <div class="card">

                <form id="formImportacionCapitulos">

                    <!-- PROCESO ACTIVO -->

                    <div class="campo">

                        <label>
                            Proceso activo
                        </label>

                        <div class="proceso-activo" id="infoProcesoActivoCapitulos">

                            <strong>

                                <span id="nombreProcesoActivoCapitulos">
                                    Cargando...
                                </span>

                            </strong>

                        </div>

                    </div>


                    <!-- ARCHIVO -->

                    <div class="campo">

                        <label for="archivoCapitulos">
                            Archivo Excel
                        </label>

                        <input type="file" id="archivoCapitulos" accept=".xls,.xlsx" required>

                    </div>


                    <!-- BOTONES -->

                    <div class="acciones">

                        <button class="btn btn-primary" type="submit" data-requiere-edicion>
                        
                            Importar Capítulos
                        
                        </button>


                        <button type="button" class="btn btn-success" data-requiere-edicion onclick="calcularPuntajesCapitulos()">
                        
                            Calcular Puntajes
                        
                        </button>


                        <button type="button" class="btn btn-warning" onclick="cargarRankingCapitulos()">
                        
                            Ver Ranking
                        
                        </button>

                    </div>

                </form>

            </div>


            <!-- ==================================
                 RETROALIMENTACIÓN
                 ================================== -->

            <div id="resultadoCapitulos" class="resultado oculto"></div>

        </div>


        <!-- ======================================
             PANEL DERECHO
             ====================================== -->

        <div class="libros-panel-ranking">


            <!-- ==================================
                 FILTROS
                 ================================== -->

            <div id="filtrosRankingCapitulos" class="card">

                <h3>
                    Filtros de búsqueda
                </h3>


                <div class="filtros-ranking">

                    <input type="text" id="filtroCapituloDocente" placeholder="Buscar por cédula o docente">


                    <select id="filtroCapituloFacultad">

                        <option value="">
                            Todas las facultades
                        </option>

                    </select>

                </div>

            </div>


            <!-- ==================================
                 TABLA
                 ================================== -->

            <div id="tablaRankingContenedorCapitulos" class="card ranking-card">

                <h3>
                    Ranking de Producción Científica
                </h3>


                <div class="ranking-scroll">

                    <table class="tabla">

                        <thead>
                        
                            <tr>
                        
                                <th>Puesto</th>
                                <th>Cédula</th>
                                <th>Docente</th>
                                <th>Facultad</th>
                                <th>Carrera</th>
                                <th>Puntaje</th>
                                <th>Acciones</th>
                        
                            </tr>
                        
                        </thead>


                        <tbody id="tablaRankingCapitulos">

                        </tbody>

                    </table>

                </div>

                

            </div>


            <!-- ==================================================
                 MODAL EDITAR DATOS ACADÉMICOS
                 ================================================== -->
            
            <div id="modalEditarDatosAcademicos" class="modal oculto">
            
                <div class="modal-content">
            
                    <!-- HEADER -->
                    <div class="modal-header">
            
                        <h3 class="modal-titulo">
                            Editar datos académicos
                        </h3>
            
                        <button type="button" class="btn-cerrar" onclick="Modal.cerrar('modalEditarDatosAcademicos')">
            
                            <i class="fa-solid fa-xmark"></i>
            
                        </button>
            
                    </div>
            
            
                    <!-- BODY -->
                    <div class="modal-body">
            
                        <!-- ID OCULTO -->
                        <input type="hidden" id="editarIdDocente">
            
            
                        <!-- FACULTAD -->
                        <div class="campo">
            
                            <label for="editarFacultad">
                                Facultad
                            </label>
            
                            <select id="editarFacultad">
            
                                <option value="">
                                    Seleccione una facultad
                                </option>
            
                            </select>
            
                        </div>
            
            
                        <!-- CARRERA -->
                        <div class="campo">
            
                            <label for="editarCarrera">
                                Carrera
                            </label>
            
                            <input type="text" id="editarCarrera" placeholder="Ingrese la carrera">
            
                        </div>
            
                    </div>
            
            
                    <!-- FOOTER -->
                    <div class="modal-footer">
            
                        <button type="button" class="btn btn-secondary" onclick="Modal.cerrar('modalEditarDatosAcademicos')">
            
                            Cancelar
            
                        </button>
            
            
                        <button type="button" class="btn btn-primary" onclick="guardarDatosAcademicos()">
            
                            <i class="fa-solid fa-save"></i>
            
                            Guardar cambios
            
                        </button>
            
                    </div>
            
                </div>
            
            </div>

        </div>

    </div>

</div>
