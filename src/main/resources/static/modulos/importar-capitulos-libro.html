<div class="module">

    <div class="module-header">

        <h2>Capítulos de Libro</h2>

        <p>
            Importación, cálculo de puntajes y ranking de capítulos de libro.
        </p>

    </div>

    <div class="card">

        <form id="formImportacionCapitulos">

            <div class="form-grid">

                <div class="card" id="infoProcesoActivoCapitulos">
                
                    <strong>Proceso activo:</strong>
                
                    <span id="nombreProcesoActivoCapitulos">
                        Cargando...
                    </span>
                
                </div>

                <div class="campo">

                    <label>Archivo Excel</label>

                    <input type="file" id="archivoCapitulos" accept=".xls,.xlsx" required>

                </div>

            </div>

            <div class="acciones">

                <button class="btn btn-primary" type="submit">

                    Importar Capítulos

                </button>

                <button type="button" class="btn btn-success" onclick="calcularPuntajesCapitulos()">
                
                    Calcular Puntajes
                
                </button>

                <button type="button" class="btn btn-warning" onclick="cargarRankingCapitulos()">
                
                    Ver Ranking
                
                </button>

            </div>

        </form>

    </div>

    <div id="resultadoCapitulos" class="resultado oculto">

    </div>

    <div id="filtrosRankingCapitulos" class="card oculto">
    
        <div class="filtros-ranking">

            <input type="text" id="filtroCedulaCapitulos" placeholder="Buscar por cédula">
            
            <input type="text" id="filtroDocenteCapitulos" placeholder="Buscar docente">

            <select id="filtroCarreraCapitulos">

                <option value="">
                    Todas las carreras
                </option>

            </select>

            <select id="filtroFacultadCapitulos">

                <option value="">
                    Todas las facultades
                </option>

                <option value="Facultad de Ciencias de la Computación y Diseño Web">
                    Ciencias de la Computación y Diseño Web
                </option>

                <option value="Facultad de Ciencias Empresariales">
                    Ciencias Empresariales
                </option>

                <option value="Facultad de Ciencias Pecuarias y Biológicas">
                    Ciencias Pecuarias y Biológicas
                </option>

                <option value="Facultad de Ciencias de la Industria y Producción">
                    Ciencias de la Industria y Producción
                </option>

                <option value="Facultad de Ciencias Agrarias y Forestales">
                    Ciencias Agrarias y Forestales
                </option>

                <option value="Facultad de Ciencias de la Ingeniería">
                    Ciencias de la Ingeniería
                </option>

                <option value="Facultad de Ciencias de la Educación">
                    Ciencias de la Educación
                </option>

                <option value="Facultad de Ciencias de la Salud">
                    Ciencias de la Salud
                </option>

                <option value="Facultad de Ciencias Sociales, Económicas y Financieras">
                    Ciencias Sociales, Económicas y Financieras
                </option>

            </select>

            <select id="filtroTopCapitulos">

                <option value="0">Todos</option>
                <option value="10">Top 10</option>
                <option value="20">Top 20</option>
                <option value="50">Top 50</option>

            </select>

        </div>

    </div>

    <div id="tablaRankingContenedorCapitulos" class="card oculto">

        <h3>Ranking de Capítulos de Libro</h3>

        <div class="table-responsive">

            <table class="tabla">

                <thead>

                    <tr>

                        <th>Puesto</th>
                        <th>Cédula</th>
                        <th>Docente</th>
                        <th>Carrera</th>
                        <th>Puntaje</th>

                    </tr>

                </thead>

                <tbody id="tablaRankingCapitulos">

                </tbody>

            </table>

        </div>

    </div>

</div>
