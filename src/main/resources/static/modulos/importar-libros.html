<div class="module">

    <!-- ==========================================
         ENCABEZADO
         ========================================== -->

    <div class="module-header">

        <h2>Libros</h2>

        <p>
            Importación, cálculo de puntajes y ranking de Libros.
        </p>

    </div>


    <!-- ==========================================
         CONTENIDO PRINCIPAL
         ========================================== -->

    <div class="libros-layout">


        <!-- ======================================
             PANEL IZQUIERDO
             ====================================== -->

        <div class="libros-panel-izquierdo">

            <div class="card">

                <form id="formImportacionLibros">

                    <!-- PROCESO ACTIVO -->

                    <div class="campo">

                        <label>
                            Proceso activo
                        </label>

                        <div class="proceso-activo" id="infoProcesoActivoLibros">

                            <strong>

                                <span id="nombreProcesoActivoLibros">
                                    Cargando...
                                </span>

                            </strong>

                        </div>

                    </div>


                    <!-- ARCHIVO -->

                    <div class="campo">

                        <label for="archivoLibros">
                            Archivo Excel
                        </label>

                        <input type="file" id="archivoLibros" accept=".xls,.xlsx" required>

                    </div>


                    <!-- BOTONES -->

                    <div class="acciones">

                        <button class="btn btn-primary" type="submit" data-requiere-edicion>

                            <i class="fa-solid fa-upload"></i>

                            Importar

                        </button>


                        <button type="button" class="btn btn-success" data-requiere-edicion
                            onclick="calcularPuntajesLibros()">

                            <i class="fa-solid fa-calculator"></i>

                            Calcular Puntajes

                        </button>


                        <button type="button" class="btn btn-warning" onclick="cargarRankingLibros()">

                            <i class="fa-solid fa-ranking-star"></i>

                            Ver Ranking

                        </button>

                    </div>

                </form>

            </div>


            <!-- RESULTADO -->

            <div id="resultadoLibros" class="resultado oculto"></div>

        </div>


        <!-- ======================================
             PANEL DERECHO
             ====================================== -->

        <div class="libros-panel-ranking">


            <!-- ==================================
                 FILTROS
                 SIEMPRE VISIBLES
                 ================================== -->

            <div id="filtrosRankingLibros" class="card">
            
                <h3>Filtros de búsqueda</h3>
            
                <div class="filtros-ranking">
            
                    <input type="text" id="filtroLibroDocente" placeholder="Buscar por cédula o docente">
            
                    <select id="filtroLibroFacultad">
            
                        <option value="">
                            Todas las facultades
                        </option>
            
                    </select>
            
                </div>
            
            </div>


            <!-- ==================================
                 TABLA
                 SIEMPRE VISIBLE
                 ================================== -->

            <div id="tablaRankingContenedorLibros" class="card ranking-card">
            
                <h3>
                    Ranking de Producción Científica
                </h3>
            
                <div class="ranking-scroll">
            
                    <table class="tabla">
            
                        <thead>
            
                            <tr>
            
                                <th>Puesto</th>
                                <th>Cédula</th>
                                <th>Docente</th>
                                <th>Facultad</th>
                                <th>Carrera</th>
                                <th>Puntaje</th>
            
                            </tr>
            
                        </thead>
            
                        <tbody id="tablaRankingLibros">
            
                        </tbody>
            
                    </table>
            
                </div>
            
            </div>

        </div>

    </div>

</div>
