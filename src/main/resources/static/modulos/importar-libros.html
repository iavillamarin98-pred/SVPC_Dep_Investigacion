<div class="module">

    <div class="module-header">

        <h2>Libros</h2>

        <p>
            Importación, cálculo de puntajes y ranking de Libros.
        </p>

    </div>

    <div class="card">

        <form id="formImportacionLibros">

            <div class="form-grid">

                <div class="campo">

                    <label>ID del proceso</label>

                    <input type="number" id="idProcesoLibros" value="1" required>

                </div>

                <div class="campo">

                    <label>Archivo Excel</label>

                    <input type="file" id="archivoLibros" accept=".xls,.xlsx" required>

                </div>

            </div>

            <div class="acciones">

                <button class="btn btn-primary" type="submit">

                    Importar Libros

                </button>

                <button type="button" class="btn btn-success" onclick="calcularPuntajesLibros()">

                    Calcular Puntajes

                </button>

                <button type="button" class="btn btn-warning" onclick="cargarRankingLibros()">

                    Ver Ranking

                </button>

            </div>

        </form>

    </div>

    <div id="resultadoLibros" class="resultado oculto">

    </div>

    <div class="filtros-ranking">
    
        <input type="text" id="filtroCedula" placeholder="Buscar por cédula">
    
        <input type="text" id="filtroDocente" placeholder="Buscar docente">
    
        <select id="filtroCarrera">
    
            <option value="">Todas las carreras</option>
    
        </select>
    
        <select id="filtroFacultad">
    
            <option value="">Todas las facultades</option>
    
            <option value="Facultad de Ciencias de la Computación y Diseño Web">
                Ciencias de la Computación y Diseño Web
            </option>
    
            <option value="Facultad de Ciencias Empresariales">
                Ciencias Empresariales
            </option>
    
            <option value="Facultad de Ciencias Pecuarias y Biológicas">
                Ciencias Pecuarias y Biológicas
            </option>
    
            <option value="Facultad de Ciencias de la Industria y Producción">
                Ciencias de la Industria y Producción
            </option>
    
            <option value="Facultad de Ciencias Agrarias y Forestales">
                Ciencias Agrarias y Forestales
            </option>
    
            <option value="Facultad de Ciencias de la Ingeniería">
                Ciencias de la Ingeniería
            </option>
    
            <option value="Facultad de Ciencias de la Educación">
                Ciencias de la Educación
            </option>
    
            <option value="Facultad de Ciencias de la Salud">
                Ciencias de la Salud
            </option>
    
            <option value="Facultad de Ciencias Sociales, Económicas y Financieras">
                Ciencias Sociales, Económicas y Financieras
            </option>
    
        </select>
    
        <select id="filtroTop">
    
            <option value="0">Todos</option>
    
            <option value="10">Top 10</option>
    
            <option value="20">Top 20</option>
    
            <option value="50">Top 50</option>
    
        </select>
    
    </div>

    <div id="tablaRankingContenedorLibros" class="card oculto">

        <h3>Ranking de Libros</h3>

        <div class="table-responsive">

            <table class="tabla">

                <thead>

                    <tr>

                        <th>Puesto</th>
                        <th>Cédula</th>
                        <th>Docente</th>
                        <th>Carrera</th>
                        <th>Puntaje</th>

                    </tr>

                </thead>

                <tbody id="tablaRankingLibros">

                </tbody>

            </table>

        </div>

    </div>

</div>
