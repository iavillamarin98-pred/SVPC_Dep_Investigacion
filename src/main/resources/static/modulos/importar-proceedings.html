<div class="module-header">

    <h2>Proceedings</h2>

    <p>
        Importación, cálculo de puntajes y ranking de Proceedings.
    </p>

</div>

<div class="proceedings-layout">

    <!-- =========================================
         PANEL IZQUIERDO
    ========================================== -->

    <div class="proceedings-panel-izquierdo">

        <div class="card">

            <h3>Importación</h3>

            <form id="formImportacionProceedings">

                <div class="proceso-activo" id="infoProcesoActivoProceedings">

                    <strong>Proceso activo:</strong>

                    <span id="nombreProcesoActivoProceedings">
                        Cargando...
                    </span>

                </div>

                <div class="campo" style="margin-top:15px;">

                    <label for="archivoProceedings">
                        Archivo Excel
                    </label>

                    <input type="file" id="archivoProceedings" accept=".xls,.xlsx" required>

                </div>

                <div class="acciones">

                    <button class="btn btn-primary" type="submit">

                        <i class="fa-solid fa-upload"></i>
                        Importar

                    </button>

                    <button type="button" class="btn btn-success" onclick="calcularPuntajesProceedings()">

                        <i class="fa-solid fa-calculator"></i>
                        Calcular Puntajes

                    </button>

                    <button type="button" class="btn btn-warning" onclick="cargarRankingProceedings()">

                        <i class="fa-solid fa-ranking-star"></i>
                        Ver Ranking

                    </button>

                </div>

            </form>

        </div>

        <div id="resultadoProceedings" class="resultado oculto">
        </div>

    </div>


    <!-- =========================================
         PANEL DERECHO
    ========================================== -->

    <div class="proceedings-panel-ranking">

        <div id="tablaRankingContenedorProceedings" class="card ranking-card">

            <h3>
                Ranking de Proceedings
            </h3>

            <!-- FILTROS -->

            <div class="filtros-ranking">

                <div class="campo">

                    <label for="filtroProceedingDocente">
                        Buscar docente
                    </label>

                    <input type="text" id="filtroProceedingDocente" placeholder="Cédula o nombre...">

                </div>

                <div class="campo">

                    <label for="filtroProceedingFacultad">
                        Facultad
                    </label>

                    <select id="filtroProceedingFacultad">

                        <option value="">
                            Todas las facultades
                        </option>

                    </select>

                </div>

            </div>


            <!-- TABLA -->

            <div class="ranking-scroll">

                <table class="tabla">

                    <thead>

                        <tr>

                            <th>Puesto</th>
                            <th>Cédula</th>
                            <th>Docente</th>
                            <th>Facultad</th>
                            <th>Carrera</th>
                            <th>Puntaje</th>

                        </tr>

                    </thead>

                    <tbody id="tablaRankingProceedings">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>
